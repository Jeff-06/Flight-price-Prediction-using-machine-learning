```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Price Predictor</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.card{
    width:100%;
    max-width:1000px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

.header{
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    color:white;
    text-align:center;
    padding:40px;
}

.header h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

.header p{
    opacity:.9;
}

.content{
    padding:35px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

input,select{
    padding:14px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}

.predict-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#2563eb,#06b6d4);
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.predict-btn:hover{
    transform:translateY(-2px);
}

.result{
    margin-top:25px;
    text-align:center;
    display:none;
}

.result-card{
    background:#f8fafc;
    border-radius:16px;
    padding:25px;
}

.result-title{
    color:#64748b;
    margin-bottom:10px;
}

.price{
    font-size:2.5rem;
    font-weight:bold;
    color:#16a34a;
}
</style>
</head>
<body>

<div class="card">

    <div class="header">
        <h1>✈ Flight Price Predictor</h1>
        <p>Predict airline ticket prices using Machine Learning</p>
    </div>

    <div class="content">

        <form id="predictionForm">

            <div class="form-grid">

                <div class="field">
                    <label>Airline</label>
                    <select id="airline">
                        <option value="Air_India">Air India</option>
                        <option value="Indigo">Indigo</option>
                        <option value="Vistara">Vistara</option>
                        <option value="SpiceJet">SpiceJet</option>
                        <option value="AirAsia">AirAsia</option>
                        <option value="GO_FIRST">GO First</option>
                    </select>
                </div>

                <div class="field">
                    <label>Source City</label>
                    <select id="source_city">
                        <option>Delhi</option>
                        <option>Mumbai</option>
                        <option>Bangalore</option>
                        <option>Chennai</option>
                        <option>Hyderabad</option>
                        <option>Kolkata</option>
                    </select>
                </div>

                <div class="field">
                    <label>Destination City</label>
                    <select id="destination_city">
                        <option>Mumbai</option>
                        <option>Delhi</option>
                        <option>Bangalore</option>
                        <option>Chennai</option>
                        <option>Hyderabad</option>
                        <option>Kolkata</option>
                    </select>
                </div>

                <div class="field">
                    <label>Departure Time</label>
                    <select id="departure_time">
                        <option>Morning</option>
                        <option>Afternoon</option>
                        <option>Evening</option>
                        <option>Night</option>
                        <option>Early_Morning</option>
                        <option>Late_Night</option>
                    </select>
                </div>

                <div class="field">
                    <label>Arrival Time</label>
                    <select id="arrival_time">
                        <option>Morning</option>
                        <option>Afternoon</option>
                        <option>Evening</option>
                        <option>Night</option>
                        <option>Early_Morning</option>
                        <option>Late_Night</option>
                    </select>
                </div>

                <div class="field">
                    <label>Stops</label>
                    <select id="stops">
                        <option value="zero">Non Stop</option>
                        <option value="one">1 Stop</option>
                        <option value="two_or_more">2+ Stops</option>
                    </select>
                </div>

                <div class="field">
                    <label>Class</label>
                    <select id="travel_class">
                        <option>Economy</option>
                        <option>Business</option>
                    </select>
                </div>

                <div class="field">
                    <label>Duration (Hours)</label>
                    <input type="number" step="0.01" id="duration" required>
                </div>

                <div class="field">
                    <label>Days Left</label>
                    <input type="number" id="days_left" required>
                </div>

            </div>

            <button type="submit" class="predict-btn">
                Predict Price
            </button>

        </form>

        <div class="result" id="resultBox">
            <div class="result-card">
                <div class="result-title">Estimated Ticket Price</div>
                <div class="price" id="priceText">₹0</div>
            </div>
        </div>

    </div>

</div>

<script>
document.getElementById("predictionForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const response = await fetch("/predict",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            airline:document.getElementById("airline").value,
            source_city:document.getElementById("source_city").value,
            destination_city:document.getElementById("destination_city").value,
            departure_time:document.getElementById("departure_time").value,
            arrival_time:document.getElementById("arrival_time").value,
            stops:document.getElementById("stops").value,
            class:document.getElementById("travel_class").value,
            duration:Number(document.getElementById("duration").value),
            days_left:Number(document.getElementById("days_left").value)
        })
    });

    const data = await response.json();

    document.getElementById("resultBox").style.display="block";
    document.getElementById("priceText").innerText =
        "₹" + Number(data.predicted_price).toLocaleString("en-IN");
});
</script>

</body>
</html>
```
